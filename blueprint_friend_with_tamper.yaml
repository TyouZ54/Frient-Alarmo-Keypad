blueprint:
  name: "Clavier Frient avec centrale d'alarme (ex : Alarmo) + Tamper"
  description:
    "Ce blueprint synchronise une centrale d'alarme avec un clavier Zigbee2MQTT. \nL'état de la centrale est transmis au clavier et inversement.\nGère aussi l'autoprotection (tamper) du clavier."
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    keypad_mqtt:
      name: MQTT du clavier
      description: "Topics MQTT du clavier et codes d'accès / badges RFID."
      icon: mdi:dialpad
      collapsed: false
      input:
        z2m_keypad_path:
          name: Topic d'état MQTT de votre clavier Zigbee2MQTT
          description:
            "Le topic d'état se compose du base_topic de Zigbee2MQTT et du Friendly Name de votre clavier dans Z2M.\n
            Exemple : zigbee2mqtt/Keypad"
        z2m_keypad_path_set:
          name: Topic « set » MQTT de votre clavier Zigbee2MQTT
          description:
            "Identique au topic d'état, avec /set en plus.\n
            Exemple : zigbee2mqtt/Keypad/set"
        pin_list:
          name: Liste des codes du clavier
          description:
            "Liste des codes PIN et badges RFID acceptés, séparés par des points-virgules « ; ».\n
            Exemple : 1234;+ACF5678B"
    control_panel:
      name: Centrale d'alarme
      description: "Réglages de la centrale d'alarme."
      icon: mdi:shield-lock
      collapsed: false
      input:
        control_panel:
          name: Centrale d'alarme
          description: "Une centrale d'alarme. \nExemple : Alarmo ou https://www.home-assistant.io/integrations/manual"
          default: []
          selector:
            entity:
              domain:
                - alarm_control_panel
              multiple: false
        pin_control_panel:
          name: Code de la centrale d'alarme
          description: Code PIN valide pour piloter la centrale d'alarme.
    tamper:
      name: Tamper (autoprotection du clavier)
      description: "Réaction à l'ouverture / l'arrachement du boîtier du clavier."
      icon: mdi:shield-alert-outline
      collapsed: false
      input:
        tamper_trigger_alarm:
          name: Déclencher l'alarme si tamper ET centrale armée
          description: "Si activé, l'alarme est déclenchée (alarm_trigger) lorsque le tamper est détecté alors que la centrale est armée (maison, nuit, absence...). Aucun déclenchement si elle est désarmée."
          default: false
          selector:
            boolean: {}
        action_tamper_armed:
          name: Action tamper (centrale armée)
          description: "Action exécutée lorsque le tamper est détecté alors que la centrale est armée."
          default: []
          selector:
            action: {}
        action_tamper_disarmed:
          name: Action tamper (centrale désarmée)
          description: "Action exécutée lorsque le tamper est détecté alors que la centrale est désarmée (ex : simple notification)."
          default: []
          selector:
            action: {}
    alarmo_actions:
      name: Actions déclenchées par un changement d'état de la centrale
      description: "Actions à exécuter à chaque changement d'état de la centrale."
      icon: mdi:shield-alert
      collapsed: true
      input:
        action_arming:
          name: Action « Armement en cours »
          description: Action exécutée quand la centrale passe en armement en cours.
          default: []
          selector:
            action: {}
        action_armed_home:
          name: Action « Armée maison »
          description: Action exécutée quand la centrale passe en armée maison.
          default: []
          selector:
            action: {}
        action_armed_night:
          name: Action « Armée nuit »
          description: Action exécutée quand la centrale passe en armée nuit.
          default: []
          selector:
            action: {}
        action_armed_away:
          name: Action « Armée absence »
          description: Action exécutée quand la centrale passe en armée absence.
          default: []
          selector:
            action: {}
        action_disarmed:
          name: Action « Désarmée »
          description: Action exécutée quand la centrale est désarmée.
          default: []
          selector:
            action: {}
        action_pending:
          name: Action « En attente »
          description: Action exécutée quand la centrale passe en attente (délai d'entrée).
          default: []
          selector:
            action: {}
        action_panic:
          name: Action « Panique »
          description: Action exécutée quand le bouton panique / SOS du clavier est pressé.
          default: []
          selector:
            action: {}
        action_alarm:
          name: Action « Alarme »
          description: Action exécutée quand l'alarme est déclenchée.
          default: []
          selector:
            action: {}
    custom_action_1:
      name: Code spécial 1
      description: "Action spécifique déclenchée lorsque le code 1 est saisi (code + une touche d'armement)."
      icon: mdi:gesture-tap-button
      collapsed: true
      input:
        custom_pincode_1:
          name: Code 1
          description: "Code qui déclenche l'action 1 depuis le clavier."
          default: ""
        custom_action_1:
          name: Action du code 1
          description: "Action exécutée lorsque le code 1 est saisi."
          default: []
          selector:
            action: {}
    custom_action_2:
      name: Code spécial 2
      description: "Action spécifique déclenchée lorsque le code 2 est saisi (code + une touche d'armement)."
      icon: mdi:gesture-tap-button
      collapsed: true
      input:
        custom_pincode_2:
          name: Code 2
          description: "Code qui déclenche l'action 2 depuis le clavier."
          default: ""
        custom_action_2:
          name: Action du code 2
          description: "Action exécutée lorsque le code 2 est saisi."
          default: []
          selector:
            action: {}
    custom_action_3:
      name: Code spécial 3
      description: "Action spécifique déclenchée lorsque le code 3 est saisi (code + une touche d'armement)."
      icon: mdi:gesture-tap-button
      collapsed: true
      input:
        custom_pincode_3:
          name: Code 3
          description: "Code qui déclenche l'action 3 depuis le clavier."
          default: ""
        custom_action_3:
          name: Action du code 3
          description: "Action exécutée lorsque le code 3 est saisi."
          default: []
          selector:
            action: {}
  source_url: https://github.com/Bygood91/frient_keypad_alarmo/blob/main/frient_keypad_with_alarmo.yaml
variables:
  pin_list_var: !input pin_list
  pin_list: "{{ pin_list_var.split(';') }}"
  custom_pincode_1: !input custom_pincode_1
  custom_pincode_2: !input custom_pincode_2
  custom_pincode_3: !input custom_pincode_3
  pin_actions_list: >
    {{ [custom_pincode_1, custom_pincode_2, custom_pincode_3] }}
  tamper_trigger_alarm: !input tamper_trigger_alarm
  panel_entity: !input control_panel
triggers:
  - trigger: state
    entity_id: !input control_panel
    to: arming
    id: panel_arming
  - trigger: state
    entity_id: !input control_panel
    to: armed_home
    id: panel_armed_home
  - trigger: state
    entity_id: !input control_panel
    to: armed_night
    id: panel_armed_night
  - trigger: state
    entity_id: !input control_panel
    to: disarmed
    id: panel_disarmed
  - trigger: state
    entity_id: !input control_panel
    to: armed_away
    id: panel_armed_away
  - trigger: state
    entity_id: !input control_panel
    to: pending
    id: panel_pending
  - trigger: state
    entity_id: !input control_panel
    to: triggered
    id: panel_triggered
  - trigger: mqtt
    topic: !input z2m_keypad_path
    id: keypad_mqtt
  - trigger: mqtt
    topic: !input z2m_keypad_path
    value_template: "{{ value_json.tamper }}"
    payload: "True"
    id: keypad_tamper
condition: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: panel_arming
        sequence:
          - action: mqtt.publish
            data:
              topic: !input z2m_keypad_path_set
              payload: "{\n\"arm_mode\": \n  {\n  \"mode\": \"exit_delay\"\n  }\n}"
          - choose:
            default: !input action_arming
      - conditions:
          - condition: trigger
            id: panel_armed_away
        sequence:
          - action: mqtt.publish
            data:
              topic: !input z2m_keypad_path_set
              payload: "{\n \"arm_mode\": \n  {\n   \"mode\": \"arm_all_zones\"\n  }\n}"
          - choose:
            default: !input action_armed_away
      - conditions:
          - condition: trigger
            id: panel_disarmed
        sequence:
          - action: mqtt.publish
            data:
              topic: !input z2m_keypad_path_set
              payload: "{\n \"arm_mode\": \n  {\n    \"mode\": \"disarm\"\n  }\n}"
          - choose:
            default: !input action_disarmed
      - conditions:
          - condition: trigger
            id: panel_armed_home
        sequence:
          - action: mqtt.publish
            data:
              topic: !input z2m_keypad_path_set
              payload: "{\n \"arm_mode\": \n  {\n   \"mode\": \"arm_day_zones\"\n  }\n}"
          - choose:
            default: !input action_armed_home
      - conditions:
          - condition: trigger
            id: panel_armed_night
        sequence:
          - action: mqtt.publish
            data:
              topic: !input z2m_keypad_path_set
              payload: "{\n \"arm_mode\": \n  {\n   \"mode\": \"arm_night_zones\"\n  }\n}"
          - choose:
            default: !input action_armed_night
      - conditions:
          - condition: trigger
            id: panel_pending
        sequence:
          - action: mqtt.publish
            data:
              topic: !input z2m_keypad_path_set
              payload: "{\n \"arm_mode\": \n  {\n   \"mode\": \"entry_delay\"\n  }\n}"
          - choose:
            default: !input action_pending
      - conditions:
          - condition: trigger
            id: panel_triggered
        sequence:
          - action: mqtt.publish
            data:
              topic: !input z2m_keypad_path_set
              payload: "{\n \"arm_mode\": \n  {\n   \"mode\": \"in_alarm\"\n  }\n}"
          - choose:
            default: !input action_alarm
      # ---------- Tamper ----------
      - conditions:
          - condition: trigger
            id: keypad_tamper
          - condition: template
            value_template: "{{ states(panel_entity) in ['armed_home', 'armed_away', 'armed_night', 'armed_vacation', 'armed_custom_bypass'] }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ tamper_trigger_alarm }}"
                sequence:
                  - action: alarm_control_panel.alarm_trigger
                    target:
                      entity_id: !input control_panel
                    data:
                      code: !input pin_control_panel
            default: []
          - choose:
            default: !input action_tamper_armed
      - conditions:
          - condition: trigger
            id: keypad_tamper
          - condition: template
            value_template: "{{ states(panel_entity) == 'disarmed' }}"
        sequence:
          - choose:
            default: !input action_tamper_disarmed
      - conditions:
          - condition: trigger
            id: keypad_mqtt
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template:
                      '{{ trigger.payload_json.action_code in pin_list and trigger.payload_json.action
                      == "arm_all_zones" }}'
                sequence:
                  - action: alarm_control_panel.alarm_arm_away
                    target:
                      entity_id: !input control_panel
                    data:
                      code: !input pin_control_panel
              - conditions:
                  - condition: template
                    value_template:
                      '{{ trigger.payload_json.action_code in pin_list and trigger.payload_json.action
                      == "arm_day_zones" }}'
                sequence:
                  - action: alarm_control_panel.alarm_arm_home
                    target:
                      entity_id: !input control_panel
                    data:
                      code: !input pin_control_panel
              - conditions:
                  - condition: template
                    value_template:
                      '{{ trigger.payload_json.action_code in pin_list and trigger.payload_json.action
                      == "arm_night_zones" }}'
                sequence:
                  - action: alarm_control_panel.alarm_arm_night
                    target:
                      entity_id: !input control_panel
                    data:
                      code: !input pin_control_panel
              - conditions:
                  - condition: template
                    value_template:
                      '{{ trigger.payload_json.action_code in pin_list and trigger.payload_json.action
                      == "disarm" }}'
                sequence:
                  - action: alarm_control_panel.alarm_disarm
                    target:
                      entity_id: !input control_panel
                    data:
                      code: !input pin_control_panel
              - conditions:
                  - condition: template
                    value_template: '{{ trigger.payload_json.action == "emergency" }}'
                sequence:
                  - choose:
                    default: !input action_panic
              - conditions:
                  - condition: template
                    value_template: "{{ custom_pincode_1 != '' and trigger.payload_json.action_code not in [none, ''] and trigger.payload_json.action_code in custom_pincode_1 }}"
                sequence: !input "custom_action_1"
              - conditions:
                  - condition: template
                    value_template: "{{ custom_pincode_2 != '' and trigger.payload_json.action_code not in [none, ''] and trigger.payload_json.action_code in custom_pincode_2 }}"
                sequence: !input "custom_action_2"
              - conditions:
                  - condition: template
                    value_template: "{{ custom_pincode_3 != '' and trigger.payload_json.action_code not in [none, ''] and trigger.payload_json.action_code in custom_pincode_3 }}"
                sequence: !input "custom_action_3"
              - conditions:
                  - condition: template
                    value_template:
                      "{{ trigger.payload_json.action_code not in pin_list and trigger.payload_json.action_code not in pin_actions_list and trigger.payload_json.action_code | int(-1) != -1 }}"
                sequence:
                  - action: mqtt.publish
                    data:
                      topic: !input z2m_keypad_path_set
                      payload:
                        "{\n \"arm_mode\": \n  {\n   \"transaction\": \"{{ trigger.payload_json.action_transaction
                        }}\",\n   \"mode\": \"invalid_code\"\n  }\n}"
            default: []
    default: []
mode: parallel
max: 10
